name: Deploy Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:
  
env:
  AWS_REGION: us-west-2
  LAMBDA_ARCH: arm64
  LAMBDA_FUNCTION_NAME: soccer_schedule_scraper
  LAMBDA_MEMORY: 128
  LAMBDA_RUNTIME: provided.al2023
  LAMBDA_TIMEOUT: 30
  # Set to 'true' to fail deployment if previous Lambda update failed
  # Set to 'false' to proceed with caution (may mask underlying issues)
  FAIL_ON_PREVIOUS_FAILURE: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Build Lambda Binary
        run: |
          # Output binary must be named 'bootstrap' for provided.al2023 runtime
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -tags lambda.norpc -o bootstrap ./cmd/lambda

      - name: Package Lambda
        run: |
          zip function.zip bootstrap

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          # Function to wait for Lambda to be in a ready state
          # 
          # This function polls the Lambda function status and state to determine if it's ready
          # for deployment operations (code/configuration updates).
          # 
          # Environment variable dependencies:
          #   - FAIL_ON_PREVIOUS_FAILURE: Controls behavior when encountering a previously failed
          #     Lambda update (LastUpdateStatus=Failed). If set to 'true' (default), the function
          #     returns an error and aborts deployment. If set to 'false', the function proceeds
          #     with a warning, allowing deployment to continue despite the prior failure.
          #     This variable is defined at the workflow level (see env section).
          wait_for_lambda_ready() {
            local function_name=$1
            local max_attempts=30
            local wait_seconds=10
            local attempt=1
            local total_timeout=$((max_attempts * wait_seconds))
            local status=""
            local state=""
            
            echo "Checking if Lambda function is ready for updates..."
            
            while [[ $attempt -le $max_attempts ]]; do
              # Get all necessary Lambda function details in a single API call.
              # Note: jq is pre-installed on GitHub-hosted runners.
              # Use quoted variables here to avoid word splitting and globbing issues
              # if the function name or AWS region were ever to contain spaces or
              # shell metacharacters. This is a defensive best practice for bash.
              function_details=$(aws lambda get-function \
                --function-name "${function_name}" \
                --region "${AWS_REGION}" \
                --query 'Configuration.{Status:LastUpdateStatus,State:State,Code:LastUpdateStatusReasonCode,Reason:LastUpdateStatusReason}' \
                --output json 2>/dev/null)
              
              # Defensive parsing of function_details to avoid silent jq failures
              if [[ -z "$function_details" ]]; then
                echo "ERROR: Unable to retrieve Lambda function details (empty response from aws lambda get-function)." >&2
                echo "DEBUG: function_name='${function_name}', region='${AWS_REGION}'" >&2
                echo "Attempt $attempt/$max_attempts - Unable to retrieve function details"
                sleep $wait_seconds
                attempt=$((attempt + 1))
                continue
              fi
              
              # Validate that the response is valid JSON before attempting to extract fields
              if ! echo "$function_details" | jq empty >/dev/null 2>&1; then
                echo "ERROR: Received invalid JSON when retrieving Lambda function details." >&2
                echo "DEBUG: Raw function_details payload:" >&2
                echo "$function_details" >&2
                echo "Attempt $attempt/$max_attempts - Invalid JSON response"
                sleep $wait_seconds
                attempt=$((attempt + 1))
                continue
              fi
              
              # Parse all fields from the single API call
              status=$(echo "$function_details" | jq -r '.Status // "Unknown"')
              state=$(echo "$function_details" | jq -r '.State // "Unknown"')
              
              echo "Attempt $attempt/$max_attempts - State: $state, LastUpdateStatus: $status"
              
              # Check critical failure states first
              if [[ "$state" == "Failed" ]]; then
                # State=Failed indicates that the Lambda function itself is broken and cannot be updated safely from this workflow.
                echo "ERROR: Lambda function is in Failed state. Cannot proceed with deployment from this workflow."
                echo "This usually indicates a problem with the function configuration, VPC/network settings, or IAM permissions."
                echo "Next steps: Inspect the function's CloudWatch Logs, verify the Lambda configuration (runtime, handler, environment variables),"
                echo "           and review associated VPC subnets/security groups and IAM execution role in the AWS Console before retrying."
                return 1
              fi
              
              # Check if function is ready (Active state with Successful update or Unknown status for newly created functions)
              # For newly created functions, LastUpdateStatus might be missing/null (parsed as "Unknown")
              # First, require the Lambda function to be in an Active state before making any
              # readiness or previous-failure decisions. This avoids treating transitional
              # states (e.g., Pending, InProgress) as if a prior update had definitively failed.
              if [[ "$state" == "Active" ]]; then
                # When the function is Active with a Successful or Unknown LastUpdateStatus,
                # we consider it fully ready for deployment.
                if [[ "$status" == "Successful" || "$status" == "Unknown" ]]; then
                  if [[ "$status" == "Unknown" ]]; then
                    echo "Lambda function is Active with no LastUpdateStatus (likely newly created). Treating as ready."
                  else
                    echo "Lambda function is ready!"
                  fi
                  return 0
                elif [[ "$status" == "Failed" ]]; then
                  # Only when the function is Active and the LastUpdateStatus is Failed do we
                  # treat this as a previous Lambda update failure. This prevents misleading
                  # error messages when the function is still in a non-Active transitional state.
                  echo "========================================="
                  echo "WARNING: Previous Lambda update FAILED (State: $state, Status: $status)"
                  echo "========================================="
                  
                  # Extract error details from the same API call result for verbose debugging.
                  error_code=$(echo "$function_details" | jq -r '.Code // "Not available"')
                  error_reason=$(echo "$function_details" | jq -r '.Reason // "Not available"')
                  
                  # Display error information to aid troubleshooting.
                  echo "Error Code: ${error_code}"
                  echo "Error Reason: ${error_reason}"
                  echo ""
                  echo "Risks of proceeding:"
                  echo "  - The Lambda function may be in an inconsistent state"
                  echo "  - Previous deployment issues may not be resolved"
                  echo "  - New deployment could fail or behave unexpectedly"
                  echo "  - Underlying infrastructure or permission issues may persist"
                  echo ""
                  
                  # Check environment variable to determine behavior (with default).
                  # This allows deployments to optionally proceed despite a known prior failure.
                  if [[ "${FAIL_ON_PREVIOUS_FAILURE:-true}" = "true" ]]; then
                    echo "FAIL_ON_PREVIOUS_FAILURE is set to 'true'. Aborting deployment."
                    echo "To proceed despite previous failure, set FAIL_ON_PREVIOUS_FAILURE=false"
                    echo "========================================="
                    return 1
                  else
                    echo "FAIL_ON_PREVIOUS_FAILURE is set to 'false'. Proceeding with deployment."
                    echo "NOTE: This may mask underlying issues. Consider investigating the failure."
                    echo "========================================="
                    return 0
                  fi
                else
                  # Active state with an unexpected LastUpdateStatus. Log verbosely and allow the
                  # outer loop to continue waiting rather than making incorrect assumptions.
                  echo "DEBUG: Active Lambda function has unexpected LastUpdateStatus (State: $state, Status: $status). Continuing to wait..."
                fi
              fi
              
              # Handle known transitional states
              if [[ "$status" == "InProgress" ]]; then
                echo "Lambda update is in progress (State: $state, Status: $status). Waiting ${wait_seconds} seconds..."
              elif [[ "$state" == "Pending" ]]; then
                echo "Lambda is in Pending state (State: $state, Status: $status). Waiting ${wait_seconds} seconds..."
              elif [[ "$state" == "Inactive" ]]; then
                echo "WARNING: Lambda function is Inactive. Waiting for it to become Active..."
              else
                # Log warning for unexpected states but continue waiting
                echo "WARNING: Unexpected state combination (State: $state, Status: $status). Continuing to wait..."
              fi
              
              sleep $wait_seconds
              attempt=$((attempt + 1))
            done
            
            # Timeout reached while waiting for the Lambda function to become ready; provide detailed guidance for operator troubleshooting.
            echo "ERROR: Timeout waiting for Lambda to be ready after ${total_timeout} seconds."
            echo "Final observed Lambda state - State: $state, LastUpdateStatus: $status."
            echo "Next steps:"
            echo "  - Check the AWS Lambda console for function \"${LAMBDA_FUNCTION_NAME}\" in region \"${AWS_REGION}\" to confirm its current state."
            echo "  - Verify that the Lambda execution role has the correct permissions and that recent configuration changes are valid."
            echo "  - Inspect recent CloudWatch Logs for this function for initialization or deployment errors."
            echo "  - If the function is stuck in Pending or Failed states, resolve any configuration or permission issues and then retry the deployment."
            return 1
          }

          # Check if Lambda function exists
          if aws lambda get-function --function-name "${LAMBDA_FUNCTION_NAME}" --region "${AWS_REGION}" &>/dev/null; then
            echo "Function exists, checking readiness..."
            
            # Wait for Lambda to be ready before updating
            if ! wait_for_lambda_ready "${LAMBDA_FUNCTION_NAME}"; then
              echo "Error: Lambda function is not ready for updates after waiting"
              exit 1
            fi
            
            echo "Updating code..."
            aws lambda update-function-code \
              --function-name "${LAMBDA_FUNCTION_NAME}" \
              --zip-file fileb://function.zip \
              --region "${AWS_REGION}"
            
            # Wait again after code update before configuration update
            if ! wait_for_lambda_ready "${LAMBDA_FUNCTION_NAME}"; then
              echo "Error: Lambda function is not ready after code update"
              exit 1
            fi
            
            echo "Updating function configuration..."
            aws lambda update-function-configuration \
              --function-name "${LAMBDA_FUNCTION_NAME}" \
              --timeout "${LAMBDA_TIMEOUT}" \
              --memory-size "${LAMBDA_MEMORY}" \
              --region "${AWS_REGION}"

            # Debugging: Log that we are now waiting for the Lambda function
            # to transition back into a ready/Active state after the configuration
            # update. The update-function-configuration API is asynchronous, so
            # skipping this wait could cause us to report success while the
            # function is still updating or has failed the new configuration.
            echo "Configuration update initiated, waiting for Lambda to become ready..."

            # Final readiness check for the existing Lambda function after applying
            # configuration changes. This mirrors the post-creation readiness check
            # in the 'create-function' branch and ensures consistent deployment
            # semantics across both paths.
            if ! wait_for_lambda_ready "${LAMBDA_FUNCTION_NAME}"; then
              echo "Error: Lambda function is not ready after configuration update"
              exit 1
            fi
          else
            echo "Function does not exist, creating..."
            aws lambda create-function \
              --function-name "${LAMBDA_FUNCTION_NAME}" \
              --runtime "${LAMBDA_RUNTIME}" \
              --role "${{ secrets.LAMBDA_ROLE_ARN }}" \
              --handler bootstrap \
              --timeout "${LAMBDA_TIMEOUT}" \
              --memory-size "${LAMBDA_MEMORY}" \
              --zip-file fileb://function.zip \
              --region "${AWS_REGION}" \
              --architectures "${LAMBDA_ARCH}"

            # Debugging: Log that we are now waiting for the newly created Lambda function
            # to transition into a ready/Active state before declaring deployment success.
            echo "Create operation completed, waiting for Lambda to become ready..."

            # After creating the Lambda function, explicitly wait for it to reach
            # a ready state. This mirrors the update path behavior and prevents us
            # from reporting success while the function is still provisioning or failed.
            if ! wait_for_lambda_ready "${LAMBDA_FUNCTION_NAME}"; then
              echo "Error: Lambda function did not become ready after creation"
              exit 1
            fi
          fi
          
          echo "Deployment successful!"
